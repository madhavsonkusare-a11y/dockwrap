[package]
name = "dockwrap"
version = "0.3.1"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["devtools", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
