[package]
name = "local-store"
version = "0.5.0-alpha.1"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
repository = "https://github.com/madhavsonkusare-a11y/dockwrap"
readme = "README.md"
description = "Native desktop windows and verified setup recipes for self-hosted web apps."

[dependencies]
tauri = { version = "2", features = ["devtools", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
