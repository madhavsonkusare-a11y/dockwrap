[package]
name = "dockwrap"
version = "0.1.1"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["devtools", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned to the exact versions Tauri already uses so we reuse its crate graph
# (no duplicate `windows-sys`/`raw-window-handle` → no HWND type mismatch).
raw-window-handle = "0.6.2"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
tauri-build = "2"
