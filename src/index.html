<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>dockwrap</title>
<style>
  :root { --bg:#0f1117; --fg:#e6e6e6; --accent:#0ea5e9; --muted:#8b8b8b; --card:#171a23; --border:#232733; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--fg); padding:18px; }
  h1 { font-size:18px; margin:0 0 2px; }
  .sub { color:var(--muted); font-size:12px; margin-bottom:16px; }
  .app { display:flex; align-items:center; justify-content:space-between; padding:10px 12px; background:var(--card); border:1px solid var(--border); border-radius:8px; margin-bottom:8px; }
  .app .info { display:flex; align-items:center; gap:10px; min-width:0; }
  .app .logo { width:28px; height:28px; border-radius:6px; object-fit:cover; flex:0 0 auto; background:var(--border); }
  .app .meta { min-width:0; }
  .app .name { font-weight:600; font-size:14px; }
  .app .url { color:var(--muted); font-size:11px; margin-top:2px; word-break:break-all; }
  .badge { display:inline-block; font-size:10px; color:#7dd3fc; border:1px solid #0c4a6e; border-radius:4px; padding:0 4px; margin-left:6px; vertical-align:middle; }
  button { background:var(--accent); color:#04121b; border:none; padding:7px 14px; border-radius:6px; cursor:pointer; font-weight:600; font-size:13px; }
  button:hover { filter:brightness(1.1); }
  .actions { display:flex; gap:6px; flex:0 0 auto; }
  .actions .ghost { background:var(--card); color:var(--fg); border:1px solid var(--border); }
  .add { margin-top:14px; display:flex; flex-wrap:wrap; gap:6px; }
  input { flex:1; min-width:120px; background:var(--card); border:1px solid var(--border); color:var(--fg); padding:8px; border-radius:6px; font-size:13px; }
  details.adv { margin-top:8px; }
  details.adv summary { cursor:pointer; color:var(--muted); font-size:12px; }
  #msg { color:var(--accent); font-size:12px; min-height:16px; margin-top:8px; }
</style>
</head>
<body>
  <h1>dockwrap</h1>
  <div class="sub">Native desktop shells for self-hosted apps</div>
  <div id="apps"></div>
  <div class="add">
    <input id="name" placeholder="app name (e.g. penpot)" />
    <input id="url" placeholder="url (http://localhost:9001)" />
    <input id="icon" placeholder="icon path (optional)" />
    <button onclick="addApp()">Add</button>
  </div>
  <details class="adv">
    <summary>Advanced (Docker Compose boot)</summary>
    <div class="add">
      <input id="compose" placeholder="compose file/dir (optional)" />
      <input id="health" placeholder="health url:port (optional)" />
    </div>
  </details>
  <div id="msg"></div>

<script>
  const api = window.__TAURI__.core;

  function escapeHtml(s) {
    return String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function render(apps) {
    const el = document.getElementById('apps');
    el.innerHTML = '';
    if (!apps || !apps.length) {
      el.innerHTML = '<div class="sub">No apps yet. Add one above.</div>';
      return;
    }
    apps.forEach(a => {
      const row = document.createElement('div');
      row.className = 'app';

      const info = document.createElement('div');
      info.className = 'info';
      if (a.icon) {
        const img = document.createElement('img');
        img.className = 'logo';
        img.src = 'file://' + a.icon;
        info.appendChild(img);
      }
      const meta = document.createElement('div');
      meta.className = 'meta';
      const composeBadge = a.compose ? '<span class="badge">🐳 compose</span>' : '';
      meta.innerHTML = '<div class="name">' + escapeHtml(a.name) + composeBadge + '</div>' +
                       '<div class="url">' + escapeHtml(a.url) + '</div>';
      info.appendChild(meta);
      row.appendChild(info);

      const actions = document.createElement('div');
      actions.className = 'actions';
      const btn = document.createElement('button');
      btn.textContent = 'Open';
      btn.onclick = () => api.invoke('open_app', { name: a.name });
      const sc = document.createElement('button');
      sc.textContent = 'Shortcut';
      sc.className = 'ghost';
      sc.onclick = () => api.invoke('create_shortcut', { name: a.name })
        .then(p => setMsg('shortcut: ' + p))
        .catch(e => setMsg('shortcut error: ' + e));
      const rm = document.createElement('button');
      rm.textContent = 'Remove';
      rm.className = 'ghost';
      rm.onclick = () => api.invoke('remove_app_cmd', { name: a.name })
        .then(ok => { if (ok) { setMsg('removed ' + a.name); refresh(); } else setMsg('not found: ' + a.name); })
        .catch(e => setMsg('remove error: ' + e));
      actions.appendChild(btn);
      actions.appendChild(sc);
      actions.appendChild(rm);
      row.appendChild(actions);

      el.appendChild(row);
    });
  }

  function setMsg(m) { document.getElementById('msg').textContent = m; }

  function addApp() {
    const name = document.getElementById('name').value.trim();
    const url = document.getElementById('url').value.trim();
    if (!name || !url) { setMsg('name and url are required'); return; }
    const icon = document.getElementById('icon').value.trim();
    const compose = document.getElementById('compose').value.trim();
    const health = document.getElementById('health').value.trim();
    api.invoke('add_app', {
      name, url,
      icon: icon || null,
      compose: compose || null,
      health: health || null
    })
      .then(() => {
        setMsg('added ' + name);
        document.getElementById('name').value = '';
        document.getElementById('url').value = '';
        document.getElementById('icon').value = '';
        document.getElementById('compose').value = '';
        document.getElementById('health').value = '';
        refresh();
      })
      .catch(e => setMsg('error: ' + e));
  }

  function refresh() {
    api.invoke('list_apps').then(render).catch(e => setMsg('load error: ' + e));
  }

  // Instant render from the apps Rust injected at load, then live refresh.
  render(window.__APPS__ || []);
  refresh();
</script>
</body>
</html>
