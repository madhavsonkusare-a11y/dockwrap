<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>dockwrap</title>
<style>
  /* HeroUI v3 visual language, translated to vanilla CSS (no React/Tailwind). */
  :root {
    /* Surfaces (matches HeroUI dark theme) */
    --bg: #0f0f0f;            /* --heroui-background */
    --card: #171a23;           /* --heroui-card (elevated) */
    --border: #232733;        /* ~rgba(255 255 255 / 0.06) */
    --fg: #e6e6e6;            /* --heroui-foreground */
    --muted: #8b8b8b;         /* --heroui-muted */
    --accent: #3b82f6;        /* --heroui-primary (blue-500) */

    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    font-size: 13px;
    line-height: 1.5;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 22px;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-family);
    font-size: var(--font-size);
    min-width: 460px;
  }

  h1 { font-size: 18px; font-weight: 600; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 18px; }

  /* ---- App card (mirrors HeroUI Card: surface + border + elevation) ---- */
  .app {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 4px 30px 0 rgba(0, 0, 0, 0.20);
    margin-bottom: 8px;
  }

  .app .info { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
  .app .logo {
    width: 32px; height: 32px;
    border-radius: 6px;
    object-fit: cover;
    flex: 0 0 auto;
    background: var(--border);
    border: 1px solid var(--border);
  }
  .app .meta { min-width: 0; }
  .app .name { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 6px; }
  .app .url { color: var(--muted); font-size: 11px; margin-top: 2px; word-break: break-all; }

  /* ---- Badge (HeroUI-style pill) ---- */
  .badge {
    display: inline-flex;
    align-items: center;
    font-size: 10px;
    font-weight: 600;
    color: #7dd3fc;            /* sky-300 */
    background: rgba(30, 64, 175, 0.18);  /* blue-900/35 */
    border: 1px solid rgba(59, 130, 246, 0.30);
    border-radius: 999px;
    padding: 2px 8px;
  }

  /* ---- Buttons (HeroUI Primary + Ghost variants) ---- */
  button {
    background: var(--accent);
    color: #04121b;
    border: none;
    padding: 7px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
    transition: filter 150ms ease, opacity 150ms ease;
    flex: 0 0 auto;
  }
  button:hover { filter: brightness(1.1); }
  button:active { filter: brightness(0.95); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Ghost variant — for secondary actions (Shortcut / Remove) */
  button.ghost {
    background: var(--card);
    color: var(--fg);
    border: 1px solid var(--border);
  }
  button.ghost:hover { background: #1f2430; }

  .actions { display: flex; gap: 6px; align-items: center; }

  /* ---- Add form ---- */
  .add { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 6px; }
  input {
    flex: 1; min-width: 120px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--fg);
    padding: 8px;
    border-radius: 6px;
    font-size: 13px;
  }
  input::placeholder { color: var(--muted); }

  /* ---- Advanced section ---- */
  details.adv {
    margin-top: 10px;
  }
  details.adv summary {
    cursor: pointer;
    color: var(--muted);
    font-size: 12px;
    user-select: none;
  }

  #msg { color: var(--accent); font-size: 12px; min-height: 16px; margin-top: 8px; }
</style>
</head>
<body>
  <h1>dockwrap</h1>
  <div class="sub">Native desktop shells for self-hosted apps</div>
  <div id="apps"></div>
  <div class="add">
    <input id="name" placeholder="app name (e.g. penpot)" />
    <input id="url" placeholder="url (http://localhost:9001)" />
    <input id="icon" placeholder="icon path (optional)" />
    <button onclick="addApp()">Add</button>
  </div>
  <details class="adv">
    <summary>Advanced (Docker Compose boot)</summary>
    <div class="add">
      <input id="compose" placeholder="compose file/dir (optional)" />
      <input id="health" placeholder="health url:port (optional)" />
    </div>
  </details>
  <div id="msg"></div>

<script>
  const api = window.__TAURI__.core;

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function render(apps) {
    const el = document.getElementById('apps');
    el.innerHTML = '';
    if (!apps || !apps.length) {
      el.innerHTML = '<div class="sub">No apps yet. Add one above.</div>';
      return;
    }
    apps.forEach(a => {
      const row = document.createElement('div');
      row.className = 'app';

      const info = document.createElement('div');
      info.className = 'info';
      if (a.icon) {
        const img = document.createElement('img');
        img.className = 'logo';
        img.src = 'file://' + a.icon;
        info.appendChild(img);
      }
      const meta = document.createElement('div');
      meta.className = 'meta';
      const composeBadge = a.compose ? '<span class="badge">🐳 compose</span>' : '';
      meta.innerHTML =
        '<div class="name">' + escapeHtml(a.name) + composeBadge + '</div>' +
        '<div class="url">' + escapeHtml(a.url) + '</div>';
      info.appendChild(meta);
      row.appendChild(info);

      const actions = document.createElement('div');
      actions.className = 'actions';

      const openBtn = document.createElement('button');
      openBtn.textContent = 'Open';
      openBtn.onclick = () => api.invoke('open_app', { name: a.name });

      const scBtn = document.createElement('button');
      scBtn.textContent = 'Shortcut';
      scBtn.className = 'ghost';
      scBtn.onclick = () => api.invoke('create_shortcut', { name: a.name })
        .then(p => setMsg('shortcut: ' + p))
        .catch(e => setMsg('shortcut error: ' + e));

      const rmBtn = document.createElement('button');
      rmBtn.textContent = 'Remove';
      rmBtn.className = 'ghost';
      rmBtn.onclick = () => api.invoke('remove_app_cmd', { name: a.name })
        .then(ok => { if (ok) { setMsg('removed ' + a.name); refresh(); } else setMsg('not found: ' + a.name); })
        .catch(e => setMsg('remove error: ' + e));

      actions.appendChild(openBtn);
      actions.appendChild(scBtn);
      actions.appendChild(rmBtn);
      row.appendChild(actions);

      el.appendChild(row);
    });
  }

  function setMsg(m) { document.getElementById('msg').textContent = m; }

  function addApp() {
    const name = document.getElementById('name').value.trim();
    const url = document.getElementById('url').value.trim();
    if (!name || !url) { setMsg('name and url are required'); return; }
    const icon = document.getElementById('icon').value.trim();
    const compose = document.getElementById('compose').value.trim();
    const health = document.getElementById('health').value.trim();
    api.invoke('add_app', {
      name, url,
      icon: icon || null,
      compose: compose || null,
      health: health || null
    })
      .then(() => {
        setMsg('added ' + name);
        document.getElementById('name').value = '';
        document.getElementById('url').value = '';
        document.getElementById('icon').value = '';
        document.getElementById('compose').value = '';
        document.getElementById('health').value = '';
        refresh();
      })
      .catch(e => setMsg('error: ' + e));
  }

  function refresh() {
    api.invoke('list_apps').then(render).catch(e => setMsg('load error: ' + e));
  }

  // Instant render from the apps Rust injected at load, then live refresh.
  render(window.__APPS__ || []);
  refresh();
</script>
</body>
</html>
