<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Local Store</title>
<style>
  /* Inter font (bundled locally — OFL licensed, no network at runtime). */
  @font-face {
    font-family: "Inter";
    src: url("fonts/InterVariable.woff2") format("woff2-variations");
    font-weight: 100 900;
    font-display: swap;
  }

  /* HeroUI v3 visual language, translated to vanilla CSS (no React/Tailwind). */
  :root {
    /* --- Design tokens (single source of truth) --- */
    --bg: #0f0f0f;            /* --heroui-background */
    --card: #171a23;          /* --heroui-card (elevated) */
    --border: #232733;        /* ~rgba(255 255 255 / 0.06) */
    --fg: #e6e6e6;            /* --heroui-foreground */
    --muted: #8b8b8b;         /* --heroui-muted (passes WCAG AA on --bg) */
    --accent: #3b82f6;        /* --heroui-primary (blue-500) */
    --accent-hover: #60a5fa;  /* blue-400 */
    --danger: #f87171;        /* red-400 — destructive affordance */
    --danger-strong: #ef4444; /* red-500 */

    --font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-size: 13px;

    --radius: 8px;
    --radius-sm: 6px;

    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;

    font-family: var(--font-family);
    font-size: var(--font-size);
    line-height: 1.5;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: var(--space-5);
    max-width: 460px;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-family);
    font-size: var(--font-size);
  }

  h1 { font-size: 18px; font-weight: 600; margin: 0 0 var(--space-1); letter-spacing: -0.015em; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: var(--space-4); }

  /* ---- App list (semantic <ul>) ---- */
  ul.app-list { list-style: none; margin: 0; padding: 0; }

  /* ---- App card (mirrors HeroUI Card: surface + border + elevation) ---- */
  .app {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
    padding: var(--space-3) 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 4px 30px 0 rgba(0, 0, 0, 0.20);
    margin-bottom: var(--space-2);
  }

  .app .info { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
  .app .logo {
    width: 32px; height: 32px;
    border-radius: var(--radius-sm);
    object-fit: cover;
    flex: 0 0 auto;
    background: var(--border);
    border: 1px solid var(--border);
  }
  .app .meta { min-width: 0; }
  .app .name { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 6px; }
  .app .url { color: var(--muted); font-size: 11px; margin-top: var(--space-1); word-break: break-all; }

  /* ---- Badge (HeroUI-style pill) ---- */
  .badge {
    display: inline-flex;
    align-items: center;
    font-size: 10px;
    font-weight: 600;
    color: #7dd3fc;            /* sky-300 */
    background: rgba(30, 64, 175, 0.18);  /* blue-900/35 */
    border: 1px solid rgba(59, 130, 246, 0.30);
    border-radius: 999px;
    padding: var(--space-1) 8px;
  }

  /* ---- Buttons (HeroUI Primary + Ghost + Danger variants) ---- */
  button {
    background: var(--accent);
    color: #04121b;
    border: 1px solid transparent;
    padding: 7px 14px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    font-size: 13px;
    transition: filter 150ms ease, background-color 150ms ease, border-color 150ms ease;
    flex: 0 0 auto;
  }
  /* Hover has a smooth ramp; the PRESS highlight is instant (Apple §1:
     feedback lives on pointer-down, not release — a 150ms transition would lag). */
  button:hover { filter: brightness(1.1); }
  button:active { filter: brightness(0.92); transition: none; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Ghost variant — for secondary actions (Shortcut) */
  button.ghost {
    background: var(--card);
    color: var(--fg);
    border: 1px solid var(--border);
  }
  button.ghost:hover { background: #1f2430; }

  /* Danger (ghost) variant — for destructive action (Remove).
     Distinct from Shortcut so a slip doesn't delete an app. */
  button.danger {
    background: var(--card);
    color: var(--danger);
    border: 1px solid var(--border);
  }
  button.danger:hover {
    background: rgba(248, 113, 113, 0.12);
    border-color: var(--danger);
    color: var(--danger-strong);
  }

  .actions { display: flex; gap: var(--space-2); align-items: center; }

  /* ---- Add form ---- */
  .add { margin-top: var(--space-4); display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .add input {
    flex: 1 1 120px;
    min-width: 0;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--fg);
    padding: 8px;
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 13px;
  }
  .add input::placeholder { color: var(--muted); }
  .add button { flex: 0 0 auto; }

  /* ---- Advanced section (progressive disclosure) ---- */
  details.adv { margin-top: var(--space-2); }
  details.adv summary {
    cursor: pointer;
    color: var(--muted);
    font-size: 12px;
    user-select: none;
    padding: var(--space-1) 0;
  }

  /* ---- Status / feedback line (success vs error are color-distinct) ---- */
  #msg { font-size: 12px; min-height: 16px; margin-top: var(--space-2); color: var(--accent); }
  #msg.err { color: var(--danger); }

  /* ---- Accessibility: visible keyboard focus (WCAG 2.4.7) ---- */
  button:focus-visible,
  input:focus-visible,
  summary:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---- Respect reduced-motion preference (Apple §14) ---- */
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
  /* Frostier surfaces for users who opt out of transparency (Apple §14). */
  @media (prefers-reduced-transparency: reduce) {
    .app, .badge, input, button, details.adv, .wizard-overlay { backdrop-filter: none; }
    .app { background: #13161d; }
  }

  /* ---- Setup wizard (Configure surface: modal + progressive disclosure) ---- */
  .wizard-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(2px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--space-4);
    z-index: 100;
  }
  .wizard {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 20px 60px 0 rgba(0, 0, 0, 0.35);
    padding: var(--space-5);
  }
  .wizard-header { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-4); }
  .wizard-step-indicator {
    display: flex;
    gap: var(--space-1);
    flex: 1;
    height: 3px;
    background: var(--border);
    border-radius: var(--radius-sm);
    overflow: hidden;
  }
  .wizard-step-bar {
    height: 100%;
    background: var(--accent);
    border-radius: var(--radius-sm);
    transition: width 150ms ease;
  }
  .wizard .step-pill {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--border);
    color: var(--muted);
  }
  .wizard .step-pill.active { background: var(--accent); color: #04121b; }
  .wizard h2 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: -0.01em; flex: 1; }
  .wizard .step-body { min-height: 160px; }
  .wizard .field { display: flex; flex-direction: column; gap: var(--space-1); margin-bottom: var(--space-3); }
  .wizard .field label { font-size: 11px; font-weight: 600; color: var(--muted); }
  .wizard input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--fg);
    padding: 8px;
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 13px;
  }
  .wizard .hint { font-size: 11px; color: var(--muted); }
  .wizard .error { color: var(--danger); font-size: 11px; min-height: 14px; }
  .wizard .nav { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-4); }
  .wizard-backdrop button:active { transition: none; }
  /* Catalog app cards shown on step 1 — pick a popular app to autofill */
  .wizard .catalog-hint { font-size: 11px; color: var(--muted); margin: var(--space-2) 0 var(--space-2); }
  .wizard .cat-icon { width: 20px; height: 20px; object-fit: contain; margin-right: 6px; vertical-align: middle; }
  .wizard .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin-top: var(--space-2); }
  .wizard .catalog-card {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: var(--space-2); border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--bg); cursor: pointer; text-align: center; transition: border-color 150ms ease;
  }
  .wizard .catalog-card:hover { border-color: var(--accent); }
  .wizard .catalog-card:active { border-color: var(--accent-hover); transition: none; }
  .wizard .catalog-card .cat-name { font-size: 12px; font-weight: 600; }
  .wizard .catalog-card .cat-cat { font-size: 9px; color: var(--muted); text-transform: uppercase; }
  /* Category filter dropdown (step 1 catalog) */
  .wizard .cat-filter {
    display: flex; align-items: center; gap: var(--space-1);
    margin: var(--space-2) 0 var(--space-2); font-size: 11px; color: var(--muted);
  }
  .wizard .cat-filter select {
    flex: 1; background: var(--bg); border: 1px solid var(--border);
    color: var(--fg); padding: 4px 8px; border-radius: var(--radius-sm);
    font-family: inherit; font-size: 11px; cursor: pointer;
  }
</style>
</head>
<body>
  <h1>Local Store</h1>
  <div class="sub">Native desktop shells for self-hosted apps</div>
  <ul id="apps" class="app-list"></ul>
  <form id="addForm" class="add" onsubmit="return false;">
    <input id="name" placeholder="app name (e.g. penpot)" />
    <input id="url" placeholder="url (http://localhost:9001)" />
    <input id="icon" placeholder="icon path (optional)" />
    <button type="submit">Add</button>
  </form>
  <details class="adv">
    <summary>Advanced (Docker Compose boot)</summary>
    <div class="add">
      <input id="compose" placeholder="compose file/dir (optional)" />
      <input id="health" placeholder="health url:port (optional)" />
    </div>
  </details>
  <div id="msg"></div>

<script>
  const api = window.__TAURI__.core;

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function setMsg(m, isError) {
    const el = document.getElementById('msg');
    el.textContent = m;
    el.className = isError ? 'err' : '';
  }

  function render(apps) {
    const el = document.getElementById('apps');
    el.innerHTML = '';
    if (!apps || !apps.length) {
      const empty = document.createElement('li');
      empty.className = 'sub';
      const text = document.createElement('span');
      text.textContent = 'No apps yet. ';
      empty.appendChild(text);
      const link = document.createElement('a');
      link.href = '#';
      link.textContent = 'Get Started';
      link.style.color = 'var(--accent)';
      link.style.fontWeight = '600';
      link.onclick = e => { e.preventDefault(); openWizard(); };
      empty.appendChild(link);
      el.appendChild(empty);
      return;
    }
    apps.forEach(a => {
      const row = document.createElement('li');
      row.className = 'app';
      const info = document.createElement('div');
      info.className = 'info';
      if (a.icon || a.favicon_url) {
        const img = document.createElement('img');
        img.className = 'logo';
        // Local file:// for bundled icons; https:// for SVH favicons.
        img.src = a.icon ? 'file://' + a.icon : a.favicon_url;
        info.appendChild(img);
      }
      const meta = document.createElement('div');
      meta.className = 'meta';
      const composeBadge = a.compose ? '<span class="badge">🐳 compose</span>' : '';
      meta.innerHTML =
        '<div class="name">' + escapeHtml(a.name) + composeBadge + '</div>' +
        '<div class="url">' + escapeHtml(a.url) + '</div>';
      info.appendChild(meta);
      row.appendChild(info);

      const actions = document.createElement('div');
      actions.className = 'actions';

      const openBtn = document.createElement('button');
      openBtn.textContent = 'Open';
      openBtn.onclick = () => api.invoke('open_app', { name: a.name });

      const scBtn = document.createElement('button');
      scBtn.textContent = 'Shortcut';
      scBtn.className = 'ghost';
      scBtn.onclick = () => api.invoke('create_shortcut', { name: a.name })
        .then(p => setMsg('shortcut: ' + p))
        .catch(e => setMsg('shortcut error: ' + e, true));

      const rmBtn = document.createElement('button');
      rmBtn.textContent = 'Remove';
      rmBtn.className = 'danger';
      rmBtn.onclick = () => {
        // Defense-in-depth: destructive action needs explicit confirmation.
        if (!window.confirm('Remove "' + a.name + '"? This cannot be undone.')) return;
        api.invoke('remove_app_cmd', { name: a.name })
          .then(ok => { if (ok) { setMsg('removed ' + a.name); refresh(); } else setMsg('not found: ' + a.name, true); })
          .catch(e => setMsg('remove error: ' + e, true));
      };

      actions.appendChild(openBtn);
      actions.appendChild(scBtn);
      actions.appendChild(rmBtn);
      row.appendChild(actions);

      el.appendChild(row);
    });
  }

  function addApp() {
    const name = document.getElementById('name').value.trim();
    const url = document.getElementById('url').value.trim();
    if (!name || !url) { setMsg('name and url are required', true); return; }
    const icon = document.getElementById('icon').value.trim();
    const compose = document.getElementById('compose').value.trim();
    const health = document.getElementById('health').value.trim();
    api.invoke('add_app', {
      name, url,
      icon: icon || null,
      compose: compose || null,
      health: health || null
    })
      .then(() => {
        setMsg('added ' + name);
        document.getElementById('name').value = '';
        document.getElementById('url').value = '';
        document.getElementById('icon').value = '';
        document.getElementById('compose').value = '';
        document.getElementById('health').value = '';
        refresh();
      })
      .catch(e => setMsg('error: ' + e, true));
  }

  document.getElementById('addForm').addEventListener('submit', addApp);

  function refresh() {
    api.invoke('list_apps').then(render).catch(e => setMsg('load error: ' + e, true));
  }

  // ---- Setup wizard logic ----
  // Configure surface: 3-step modal that reuses the existing add_app invoke.
  const WIZARD_TOTAL = 3;
  let wizardState = { name: '', url: '', icon: '', compose: '', health: '' };
  let wizardStep = 1;

  function $(id) { return document.getElementById(id); }

  function openWizard() {
    wizardState = { name: '', url: '', icon: '', compose: '', health: '' };
    wizardStep = 1;
    $('wizardError').textContent = '';
    window.__CATALOG_LOADED = false;
    renderWizardStep();
    $('wizardBackdrop').style.display = 'flex';
    $('wizardNext').focus();
    trapFocus($('wizardBackdrop'));
    // Pre-fill from the baked-in catalog so step 1 can offer "pick popular app".
    api.invoke('catalog').then(cats => {
      window.__CATALOG = Array.isArray(cats) ? cats : [];
      window.__CATALOG_LOADED = true;
      if (wizardStep === 1) renderWizardStep();
    }).catch(() => { window.__CATALOG = []; window.__CATALOG_LOADED = true; });
  }

  function closeWizard() {
    $('wizardBackdrop').style.display = 'none';
    releaseFocus();
    $('wizardError').textContent = '';
  }

  function renderWizardStep() {
    const body = $('wizardBody');
    let html = '';
    if (wizardStep === 1) {
      $('wizardTitle').textContent = 'Add app';
      html = wizardField('App name', 'name', 'e.g. penpot') +
             wizardField('URL', 'url', 'http://localhost:9001');
      // Offer to pre-fill from the curated catalog (if loaded).
      if (window.__CATALOG_LOADED) html += htmlCatalogSection();
    } else if (wizardStep === 2) {
      $('wizardTitle').textContent = 'Connect';
      html = '<p class="hint">Optional: boot a local Docker Compose stack.</p>' +
             wizardField('Compose file / dir', 'compose', './docker-compose.yml') +
             wizardField('Health check', 'health', 'http://localhost:9001/health');
    } else {
      $('wizardTitle').textContent = 'Review';
      const composeBadge = wizardState.compose ? '<span class="badge">🐳 compose</span>' : '';
      html = '<div style="margin-bottom:var(--space-3)"><span class="name" style="display:flex;align-items:center;gap:6px">' +
             escapeHtml(wizardState.name || '—') + composeBadge + '</span>' +
             '<div class="url" style="color:var(--muted);font-size:11px">' + escapeHtml(wizardState.url || '—') + '</div></div>';
      if (wizardState.icon) html += '<p class="hint">Icon: ' + escapeHtml(wizardState.icon) + '</p>';
    }
    body.innerHTML = html;
    $('wizardStepBar').style.width = Math.round((wizardStep / WIZARD_TOTAL) * 100) + '%';
    $('wizardStepPill').textContent = wizardStep + ' of ' + WIZARD_TOTAL;
    $('wizardBack').style.display = wizardStep === 1 ? 'none' : 'inline-flex';
    $('wizardNext').textContent = wizardStep === WIZARD_TOTAL ? 'Add' : 'Next';
  }

  function wizardField(label, id, placeholder) {
    return '<div class="field">' +
      '<label for="' + id + '">' + label + '</label>' +
      '<input id="' + id + '" type="text" placeholder="' + placeholder + '" ' +
      'value="' + escapeHtml(wizardState[id] || '') + '" ' +
      'oninput="wizardState.' + id + ' = this.value"/>' +
      '</div>';
  }

  function validateStep() {
    if (wizardStep === 1) {
      if (!wizardState.name.trim() || !wizardState.url.trim()) {
        return 'Name and URL are required.';
      }
      if (!/^https?:\/\//i.test(wizardState.url.trim())) {
        return 'URL must start with http:// or https://.';
      }
    }
    return null;
  }

  // --- Catalog cards: render curated apps on step 1, click to auto-fill ---
  // Returns an HTML string (matches renderWizardStep's innerHTML usage).
  function htmlCatalogSection() {
    const apps = window.__CATALOG || [];
    if (!apps.length) return '';
    // Distinct categories (sorted), with "All" first
    const cats = ['All', ...new Set(apps.map(a => a.category).filter(Boolean).sort())];
    let parts = [
      '<p class="catalog-hint">Or pick a popular app to auto-fill:</p>',
      '<div class="cat-filter"><label for="catSelect">Filter:</label>',
      '<select id="catSelect">',
      cats.map(c => '<option value="' + escapeHtml(c) + '">' + escapeHtml(c) + '</option>').join(''),
      '</select></div>',
      '<div class="catalog-grid">'
    ];
    apps.forEach(a => {
      const iconUrl = a.icon || a.favicon_url;
      const img = iconUrl ? '<img class="cat-icon" src="' + iconUrl + '" alt="" onerror="this.style.display=\'none\'">' : '';
      parts.push('<div class="catalog-card" data-cat="' + escapeHtml(a.category || '') + '" data-name="' + escapeHtml(a.name) + '">' +
        img +
        '<span class="cat-name">' + escapeHtml(a.name) + '</span>' +
        '<span class="cat-cat">' + escapeHtml(a.category || 'app') + '</span>' +
        '</div>');
    });
    parts.push('</div>');
    return parts.join('');
  }

  function pickCatalogApp(a) {
    wizardState.name    = a.name || '';
    wizardState.url     = a.url || '';
    wizardState.compose = a.compose || '';
    wizardState.health  = a.health || '';
    wizardState.icon    = a.icon || a.favicon_url || '';
    renderWizardStep();
  }

  $('wizardBack').addEventListener('click', () => {
    if (wizardStep > 1) { wizardStep--; renderWizardStep(); }
  });

  $('wizardNext').addEventListener('click', () => {
    const err = validateStep();
    if (err) { $('wizardError').textContent = err; return; }
    $('wizardError').textContent = '';
    if (wizardStep === WIZARD_TOTAL) {
      api.invoke('add_app', {
        name: wizardState.name.trim(),
        url: wizardState.url.trim(),
        icon: wizardState.icon.trim() || null,
        compose: wizardState.compose.trim() || null,
        health: wizardState.health.trim() || null
      }).then(() => {
        closeWizard();
        setMsg('added ' + wizardState.name);
        // clear the flat form too
        ['name','url','icon','compose','health'].forEach(id => $(id).value = '');
        refresh();
      }).catch(e => { $('wizardError').textContent = 'error: ' + e; });
    } else {
      wizardStep++;
      renderWizardStep();
    }
  });

  $('wizardCancel').addEventListener('click', closeWizard);
  $('wizardBackdrop').addEventListener('click', e => { if (e.target === $('wizardBackdrop')) closeWizard(); });

  // Delegated listener for catalog cards rendered via innerHTML on step 1.
  $('wizardBody').addEventListener('click', e => {
    const card = e.target.closest('.catalog-card');
    if (!card) return;
    const name = card.dataset.name;
    const found = (window.__CATALOG || []).find(a => a.name === name);
    if (found) pickCatalogApp(found);
  });

  // Category filter: hide cards not matching the selected category.
  $('wizardBody').addEventListener('change', e => {
    if (e.target.id !== 'catSelect') return;
    const val = e.target.value;
    const cards = document.querySelectorAll('#wizardBody .catalog-card');
    cards.forEach(c => {
      const show = val === 'All' || c.dataset.cat === val;
      c.style.display = show ? '' : 'none';
    });
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && $('wizardBackdrop').style.display === 'flex') closeWizard();
  });

  // focus trap
  function trapFocus(container) {
    const ff = container;
    ff._trap = true;
    const focusables = () => ff.querySelectorAll('button, input, [href], a, summary');
    const first = focusables()[0];
    const last = focusables()[focusables().length - 1];
    const onKey = e => {
      if (e.key !== 'Tab') return;
      if (e.shiftKey && document.activeElement === first) { last.focus(); e.preventDefault(); }
      else if (!e.shiftKey && document.activeElement === last) { first.focus(); e.preventDefault(); }
    };
    ff._onKey = onKey;
    ff.addEventListener('keydown', onKey);
  }
  function releaseFocus() {
    const b = $('wizardBackdrop');
    if (b._onKey) { b.removeEventListener('keydown', b._onKey); b._onKey = null; }
  }

  // Instant render from the apps Rust injected at load, then live refresh.
  render(window.__APPS__ || []);
  refresh();
</script>

<!-- Setup wizard (built in JS, appended to DOM by openWizard) -->
<div id="wizardBackdrop" class="wizard-backdrop" style="display:none;" role="presentation">
  <div class="wizard" role="dialog" aria-modal="true" aria-labelledby="wizardTitle">
    <div class="wizard-header">
      <h2 id="wizardTitle">Step 1</h2>
      <div class="wizard-step-indicator"><div id="wizardStepBar" class="wizard-step-bar" style="width:33%"></div></div>
      <span id="wizardStepPill" class="step-pill active">1 of 3</span>
    </div>
    <div id="wizardBody" class="step-body"></div>
    <div id="wizardError" class="error"></div>
    <div class="nav">
      <button type="button" class="ghost" id="wizardBack">Back</button>
      <button type="button" id="wizardNext">Next</button>
      <button type="button" class="ghost" id="wizardCancel">Cancel</button>
    </div>
  </div>
</div>
