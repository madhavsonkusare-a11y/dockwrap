name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: ""
          - platform: ubuntu-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev patchelf libssl-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build (release)
        run: cargo tauri build ${{ matrix.args }}

      # Upload ONLY the distributable installers (not bundle internals like
      # .app/Contents/* or AppImage .so libs) to keep the release asset count sane.
      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: dockwrap-${{ matrix.platform }}
          path: |
            target/release/bundle/**/*.msi
            target/release/bundle/**/*setup.exe
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.AppImage
            target/release/dockwrap
            target/release/dockwrap.exe
            target/release/dockwrap.pdb
            target/release/dockwrap.d
          if-no-files-found: ignore

  # Single publish job: collects installers from every platform and creates the
  # GitHub Release once, avoiding the softprops/action-gh-release concurrency
  # race that happens when each matrix job publishes to the same tag at once.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          pattern: dockwrap-*
          merge-multiple: true

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.msi
            artifacts/**/*setup.exe
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            artifacts/dockwrap
            artifacts/dockwrap.exe
            artifacts/dockwrap.pdb
            artifacts/dockwrap.d
