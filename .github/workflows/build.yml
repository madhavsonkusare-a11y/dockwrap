name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --locked
      # Interaction and axe checks are cross-platform. Pixel baselines are
      # reviewed and updated on Windows, where the primary WebView ships.
      - run: npm test -- --ignore-snapshots

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: ""
          - platform: ubuntu-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev patchelf libssl-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build (release)
        run: cargo tauri build ${{ matrix.args }}

      # Upload ONLY the distributable installers (not bundle internals like
      # .app/Contents/* or AppImage .so libs) to keep the release asset count sane.
      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: local-store-${{ matrix.platform }}
          path: |
            target/release/bundle/**/*.msi
            target/release/bundle/**/*setup.exe
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.AppImage
            target/release/local-store
            target/release/local-store.exe
            target/release/local-store.pdb
            target/release/local-store.d
          if-no-files-found: ignore

  # Single publish job: collects installers from every platform and creates the
  # GitHub Release once, avoiding the softprops/action-gh-release concurrency
  # race that happens when each matrix job publishes to the same tag at once.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          pattern: local-store-*

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/local-store-windows-latest/**/*.msi
            artifacts/local-store-windows-latest/**/*setup.exe
            artifacts/local-store-macos-latest/**/*.dmg
            artifacts/local-store-ubuntu-latest/**/*.deb
            artifacts/local-store-ubuntu-latest/**/*.rpm
            artifacts/local-store-ubuntu-latest/**/*.AppImage
            artifacts/local-store-ubuntu-latest/local-store
            artifacts/local-store-windows-latest/local-store.exe
            artifacts/local-store-windows-latest/local-store.pdb
            artifacts/local-store-windows-latest/local-store.d
